# Membangun installer POS Sumur Yacob untuk Windows dan Linux.
#
# Build dijalankan di runner GitHub, bukan di laptop. Jadi tidak perlu install
# Rust / Visual Studio / PC Windows / PC Linux sendiri — hasilnya identik dengan
# build di mesin aslinya.
#
# Cara pakai:
#   1. Manual  → tab Actions di GitHub, pilih workflow ini, klik "Run workflow".
#                Installer bisa di-download dari bagian "Artifacts".
#   2. Rilis   → push tag versi, mis. `git tag v0.1.8 && git push origin v0.1.8`.
#                Semua installer otomatis terpasang di halaman Releases.

name: Build Installer

on:
  workflow_dispatch: # tombol "Run workflow" manual
    inputs:
      platform:
        description: "Platform yang dibangun"
        type: choice
        default: semua
        options: [semua, windows, linux]
  push:
    branches:
      - master # merge ke master → draft Release otomatis kalau versinya baru
    tags:
      - "v*" # mis. v0.2.0 → dipakai kalau mau menandai rilis manual

# Diperlukan agar job release bisa membuat entri di halaman Releases.
permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------ Versi --
  # Membaca versi dari tauri.conf.json (satu-satunya angka yang menentukan versi
  # installer) dan memutuskan apakah run ini layak jadi Release.
  #
  # Ada supaya nomor rilis tidak perlu diketik dua kali. Sebelumnya nama tag dan
  # versi di berkas tidak saling terhubung sama sekali: tag v0.3.0 dengan berkas
  # yang masih 0.2.0 akan menghasilkan halaman Release bertuliskan v0.3.0 berisi
  # installer 0.2.0, dan tidak ada yang mencegahnya.
  versi:
    runs-on: ubuntu-latest
    outputs:
      versi: ${{ steps.baca.outputs.versi }}
      tag: ${{ steps.baca.outputs.tag }}
      rilis: ${{ steps.baca.outputs.rilis }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # butuh seluruh tag untuk tahu versi ini sudah pernah dirilis

      - name: Baca versi & tentukan perlu rilis
        id: baca
        run: |
          versi=$(node -p "require('./pos-app/src-tauri/tauri.conf.json').version")
          echo "versi=$versi" >> "$GITHUB_OUTPUT"
          echo "Versi di tauri.conf.json: $versi"

          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            # Dipicu tag manual: tag yang menentukan, tapi wajib cocok dengan berkas.
            tag="${{ github.ref_name }}"
            if [ "$tag" != "v$versi" ]; then
              echo "::error::Tag $tag tidak cocok dengan versi di tauri.conf.json ($versi)."
              echo "::error::Naikkan versinya di lima tempat, atau buat tag v$versi."
              exit 1
            fi
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "rilis=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag="v$versi"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" != "push" ]; then
            # Run manual: installer saja, tanpa Release. Tombol itu dipakai untuk
            # mencoba build, bukan untuk merilis.
            echo "rilis=false" >> "$GITHUB_OUTPUT"
            echo "Run manual — artifact saja, tidak membuat Release."
          elif git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
            # Versi ini sudah pernah dirilis. Tanpa penjagaan ini, tiap push ke
            # master akan menimpa draft (atau release) yang sudah ada.
            echo "rilis=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag $tag sudah ada — versinya belum dinaikkan, Release dilewati."
          else
            echo "rilis=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Versi baru $versi — draft Release akan dibuat sebagai $tag."
          fi

  # ---------------------------------------------------------------- Windows --
  windows:
    # Saat dipicu tag, `inputs.platform` kosong — jadi job ini tetap jalan.
    if: inputs.platform != 'linux'
    # Menunggu job versi supaya tag yang tidak cocok dengan tauri.conf.json
    # menggagalkan run lebih dulu, sebelum menghabiskan ~20 menit membangun.
    needs: versi
    runs-on: windows-latest

    defaults:
      run:
        working-directory: pos-app # semua perintah npm jalan di sini

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pos-app/package-lock.json

      # Runner Windows sudah membawa Rust, tapi versinya bisa berubah sewaktu-
      # waktu. Dipin ke stable supaya build hari ini dan 6 bulan lagi sama.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # Cache hasil kompilasi crate. Build pertama tetap ~10-15 menit; build
      # berikutnya jauh lebih cepat karena dependency tidak dikompilasi ulang.
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: pos-app/src-tauri -> target

      - name: Install dependency npm
        run: npm ci

      # Informatif saja — error tipe ditampilkan di log tapi tidak menggagalkan
      # build, supaya installer tetap terbit. Hapus baris continue-on-error
      # kalau nanti mau dijadikan gate yang ketat.
      - name: Cek tipe TypeScript
        run: npm run check
        continue-on-error: true

      # Tanggal & commit build disuntikkan ke app (tampil di layar login dan di
      # Pengaturan > Umum). Tanpa ini, "installer yang terpasang versi mana?" cuma
      # bisa ditebak — dan menebak sudah pernah menghabiskan waktu sehari penuh.
      - name: Siapkan info build
        shell: pwsh
        run: |
          $tanggal = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd HH:mm 'UTC'")
          $commit = "$env:GITHUB_SHA".Substring(0, 7)
          "VITE_BUILD_DATE=$tanggal" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VITE_BUILD_COMMIT=$commit" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Build $tanggal - $commit"

      # `tauri build` otomatis menjalankan `npm run build` (vite) lebih dulu,
      # sesuai beforeBuildCommand di tauri.conf.json.
      #
      # nsis = installer .exe (INI yang dibagikan ke client — lihat docs)
      # msi  = installer .msi (cadangan; TIDAK jalan di Windows 7, lihat docs)
      - name: Build installer Windows
        run: npm run tauri -- build --bundles nsis,msi

      - name: Upload installer sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: pos-sumur-yacob-windows
          if-no-files-found: error
          # Artifact ini cuma estafet ke job release — installernya sendiri
          # tersimpan permanen di halaman Releases. Dengan retensi bawaan 90 hari,
          # tiap run menyimpan ~350 MB (WebView2 offline ikut di-embed) dan kuota
          # storage Actions (500 MB) penuh setelah 2 run: "Artifact storage quota
          # has been hit" lalu upload gagal dan release tidak pernah terbuat.
          retention-days: 1
          path: |
            pos-app/src-tauri/target/release/bundle/nsis/*.exe
            pos-app/src-tauri/target/release/bundle/msi/*.msi

  # ------------------------------------------------------------------ Linux --
  linux:
    if: inputs.platform != 'windows'
    needs: versi

    # SENGAJA 22.04, bukan ubuntu-latest. Paket .deb terikat pada versi glibc
    # mesin yang membangunnya: dibangun di 24.04 → hanya jalan di Mint 22 ke
    # atas, dan gagal dengan "GLIBC_2.38 not found" di Mint 21. Dibangun di
    # 22.04 → jalan di Mint 21 maupun Mint 22. Jangan dinaikkan hanya karena
    # ada versi runner yang lebih baru.
    runs-on: ubuntu-22.04

    defaults:
      run:
        working-directory: pos-app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pos-app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: pos-app/src-tauri -> target
          key: linux # cache terpisah dari Windows, jangan sampai tercampur

      # Di Linux, Tauri memakai WebKitGTK milik sistem (bukan WebView2 yang
      # ikut di-bundle seperti di Windows), jadi header GTK/WebKit harus ada
      # saat kompilasi. `patchelf` dipakai bundler AppImage.
      - name: Install dependency sistem (GTK/WebKit)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependency npm
        run: npm ci

      - name: Cek tipe TypeScript
        run: npm run check
        continue-on-error: true

      - name: Siapkan info build
        run: |
          echo "VITE_BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_ENV"
          echo "VITE_BUILD_COMMIT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "Build $(date -u '+%Y-%m-%d %H:%M UTC') - ${GITHUB_SHA::7}"

      # deb      = paket untuk Linux Mint / Ubuntu (INI yang dipasang di client)
      # appimage = satu file portabel, tidak perlu dipasang; cadangan kalau
      #            .deb ditolak karena beda versi distro
      - name: Build installer Linux
        run: npm run tauri -- build --bundles deb,appimage

      - name: Upload installer sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: pos-sumur-yacob-linux
          if-no-files-found: error
          retention-days: 1 # lihat catatan di job windows
          path: |
            pos-app/src-tauri/target/release/bundle/deb/*.deb
            pos-app/src-tauri/target/release/bundle/appimage/*.AppImage

  # ---------------------------------------------------------------- Release --
  # Dipisah dari job build supaya hanya ADA SATU yang menyentuh halaman
  # Releases. Kalau tiap job build bikin release-nya sendiri, dua job yang
  # selesai berbarengan bisa menghasilkan dua draft dengan tag yang sama.
  release:
    # Jalan untuk push ke master dengan versi yang belum pernah dirilis, dan untuk
    # tag v* manual. Run manual lewat tombol tidak pernah sampai ke sini — lihat
    # job `versi` yang menentukan `rilis`.
    #
    # always() perlu supaya job ini tetap dinilai walau salah satu build di-skip
    # (mis. `platform: windows` saja); `result != 'failure'` yang menjaga Release
    # tidak dibuat dari build yang gagal.
    if: |
      always() &&
      needs.versi.outputs.rilis == 'true' &&
      needs.windows.result != 'failure' &&
      needs.linux.result != 'failure' &&
      needs.windows.result != 'cancelled' &&
      needs.linux.result != 'cancelled'
    needs: [versi, windows, linux]
    runs-on: ubuntu-latest

    steps:
      - name: Ambil semua installer
        uses: actions/download-artifact@v4
        with:
          path: installer

      # tag_name dibaca dari tauri.conf.json, bukan diketik tangan. Kalau tag-nya
      # belum ada, action ini yang membuatnya di commit yang sedang dibangun —
      # jadi merge ke master sudah cukup, tidak perlu `git tag` manual lagi.
      - name: Buat GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.versi.outputs.tag }}
          name: ${{ needs.versi.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: true # dicek dulu sebelum dipublikasikan
          generate_release_notes: true
          files: installer/**/*
